name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -count=1

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `RENCM_BUILD_GUI=OFF` builds only the dependency-free library + tests,
      # so CI does not have to fetch GLFW / Dear ImGui.
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DRENCM_BUILD_GUI=OFF
      - run: cmake --build cpp/build -j
      - run: ctest --test-dir cpp/build --output-on-failure
